name: Windows installer

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# The application lives in MONO/ (the repository root holds only the installer and that folder).
defaults:
  run:
    working-directory: MONO

jobs:
  installer:
    name: Build, install and verify MONO-Setup.exe
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Authenticode (SmartScreen trust): add repository secrets WINDOWS_SIGNING_PFX
      # (base64 of the .pfx) and WINDOWS_SIGNING_PASSWORD. Without them the build is unsigned.
      SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
      SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
      # Offline update files are signed with this Ed25519 key (scripts/release/update-key.mjs).
      MONO_UPDATE_SIGNING_KEY: ${{ secrets.MONO_UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Native capture module — unit tests (also compiles the sources)
        shell: pwsh
        run: dotnet run --project native/windows/tests/MonoAudio.Tests.csproj -c Release

      - name: Source installer — syntax and the in-app module install (windows.ps1 -HelperOnly)
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install/windows.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Host $_ }; throw 'windows.ps1 has syntax errors' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install/windows.ps1 -HelperOnly -Unattended
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:TEMP\mono-install.log" -ErrorAction SilentlyContinue; throw "windows.ps1 -HelperOnly exited with $LASTEXITCODE" }
          if (!(Test-Path .build/capture-windows/bundle/MonoAudio.exe)) { throw 'windows.ps1 -HelperOnly did not build MonoAudio.exe' }
          Remove-Item -Recurse -Force .build/capture-windows

      - name: Native capture module — publish MonoAudio.exe
        shell: pwsh
        run: |
          dotnet publish native/windows/MonoAudio.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:DebugType=None -o .build/helper --nologo
          if (!(Test-Path .build/helper/MonoAudio.exe)) { throw 'MonoAudio.exe was not produced' }

      - name: Sign the capture module
        if: env.SIGNING_PFX != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -match 'x64' | Select-Object -Last 1
          foreach ($file in @('.build/helper/MonoAudio.exe')) {
            & $signtool.FullName sign /f $pfx /p $env:SIGNING_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $file
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $file" }
          }
          Remove-Item $pfx -Force

      - name: FFmpeg (BtbN LGPL build, checksum verified)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api repos/BtbN/FFmpeg-Builds/releases/tags/latest | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -match '^ffmpeg-n[0-9.]+-latest-win64-lgpl-[0-9.]+\.zip$' } | Sort-Object name -Descending | Select-Object -First 1
          if (-not $asset) { throw 'No LGPL win64 release asset found' }
          New-Item -ItemType Directory .build/ffmpeg | Out-Null
          Invoke-WebRequest $asset.browser_download_url -OutFile .build/ffmpeg/ffmpeg.zip
          $sums = $release.assets | Where-Object name -eq 'checksums.sha256'
          if ($sums) {
            $lines = (Invoke-WebRequest $sums.browser_download_url).Content -split "`n"
            $expected = ($lines | Where-Object { $_ -match [regex]::Escape($asset.name) }) -split '\s+' | Select-Object -First 1
            $actual = (Get-FileHash .build/ffmpeg/ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
            if ($expected -and $expected -ne $actual) { throw "FFmpeg checksum mismatch: $actual vs $expected" }
            "Checksum OK: $actual"
          } else { Write-Warning 'checksums.sha256 not published; relying on HTTPS from GitHub releases' }
          Expand-Archive .build/ffmpeg/ffmpeg.zip .build/ffmpeg/x
          $bin = Get-ChildItem .build/ffmpeg/x -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          "FFMPEG_DIR=$($bin.DirectoryName)" >> $env:GITHUB_ENV
          $license = Get-ChildItem .build/ffmpeg/x -Recurse -Filter LICENSE.txt | Select-Object -First 1
          "FFMPEG_LICENSE=$($license.FullName)" >> $env:GITHUB_ENV

      - name: Stage payload
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          python installer/windows/stage.py --stage .build/installer-stage --python-home "$env:pythonLocation" `
            --node "$node" --ffmpeg-dir "$env:FFMPEG_DIR" --ffmpeg-license "$env:FFMPEG_LICENSE" --helper .build/helper/MonoAudio.exe

      - name: Version from package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "MONO_VERSION=$version" >> $env:GITHUB_ENV
          "MONO $version"

      - name: MONO.exe — the one icon (applies verified updates, starts MONO)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          # A .bat keeps cmd's quoting simple: vcvars sets up the compiler, rc embeds the icon.
          $bat = Join-Path $env:RUNNER_TEMP 'build-mono.bat'
          $lines = @('@echo off', "call `"$vcvars`" >nul || exit /b 1", "cd /d `"$PWD\native\windows\launcher`" || exit /b 1",
            'rc /nologo MONO.rc || exit /b 1',
            'cl /nologo /O1 /W4 /D_CRT_SECURE_NO_WARNINGS /DUNICODE /D_UNICODE MONO.c MONO.res /link /SUBSYSTEM:WINDOWS user32.lib shell32.lib /OUT:MONO.exe || exit /b 1')
          Set-Content -Path $bat -Value $lines -Encoding ascii
          cmd /c $bat
          if ($LASTEXITCODE -ne 0) { throw "MONO.exe build failed: $LASTEXITCODE" }
          Copy-Item native/windows/launcher/MONO.exe .build/installer-stage/MONO.exe
          if ($env:SIGNING_PFX) {
            $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -match 'x64' | Select-Object -Last 1
            & $signtool.FullName sign /f $pfx /p $env:SIGNING_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 .build/installer-stage/MONO.exe
            if ($LASTEXITCODE -ne 0) { throw 'signtool failed for MONO.exe' }
            Remove-Item $pfx -Force
          }

      - name: Portable MONO — no installation, data next to MONO.exe
        shell: pwsh
        run: |
          $portable = Join-Path $env:RUNNER_TEMP 'MONO'
          Copy-Item .build/installer-stage $portable -Recurse
          New-Item (Join-Path $portable 'MONO.portable') -ItemType File | Out-Null
          New-Item .build/portable -ItemType Directory -Force | Out-Null
          Compress-Archive -Path $portable -DestinationPath ".build/portable/MONO-portable-$env:MONO_VERSION.zip"
          "PORTABLE_DIR=$portable" >> $env:GITHUB_ENV

      - name: Portable MONO — offline update round trip (signed file → verified → applied by MONO.exe)
        shell: pwsh
        run: node scripts/ci/update-roundtrip.mjs "$env:PORTABLE_DIR"

      - name: Signed update file for this version
        if: env.MONO_UPDATE_SIGNING_KEY != ''
        shell: pwsh
        run: node scripts/release/make-update.mjs .build/installer-stage/app "$env:MONO_VERSION" ".build/portable/MONO-update-$env:MONO_VERSION.monoupdate"

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Qp "/DAppVersion=$env:MONO_VERSION" installer/windows/MONO.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

      - name: Sign MONO-Setup.exe
        if: env.SIGNING_PFX != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -match 'x64' | Select-Object -Last 1
          foreach ($file in @((Get-ChildItem .build/installer -Filter 'MONO-Setup-*.exe').FullName)) {
            & $signtool.FullName sign /f $pfx /p $env:SIGNING_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $file
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $file" }
          }
          Remove-Item $pfx -Force

      - name: Silent install, start and verify the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem .build/installer -Filter 'MONO-Setup-*.exe' | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'MONO Transcribe'
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART',"/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup exit code $($p.ExitCode)" }
          # Nothing from the runner's PATH may be used: hide node/ffmpeg/python.
          $env:Path = "$env:SystemRoot\system32;$env:SystemRoot"
          $env:MONO_HOME = Join-Path $env:RUNNER_TEMP 'mono-home'
          $out = & "$dir\runtime\python\python.exe" "$dir\app\launcher\mono_launcher.py" --dev --smoke 2>&1 | Out-String
          $out
          if ($out -notmatch '"ok": true' -or $out -notmatch [regex]::Escape("$dir\runtime\ffmpeg\ffmpeg.exe".Replace('\','\\'))) { throw 'Installed app did not start with its bundled runtimes' }
          if (!(Test-Path "$env:USERPROFILE\Desktop\MONO Transcribe.lnk") -and !(Test-Path "$env:PUBLIC\Desktop\MONO Transcribe.lnk")) { Write-Warning 'Desktop shortcut not found on runner desktop' }

      - name: Installed app — preflight sees FFmpeg, core and capture module
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'MONO Transcribe'
          $env:Path = "$env:SystemRoot\system32;$env:SystemRoot"
          $env:MONO_HOME = Join-Path $env:RUNNER_TEMP 'mono-home-2'
          $env:MONO_DEFAULT_LIBRARY_ROOT = Join-Path $env:RUNNER_TEMP 'MONO Library'
          $job = Start-Process "$dir\runtime\python\python.exe" -ArgumentList "`"$dir\app\launcher\mono_launcher.py`"",'--dev','--smoke','--smoke-hold','40' -PassThru -WindowStyle Hidden
          $health = $null
          for ($i = 0; $i -lt 60 -and -not $health; $i++) { Start-Sleep 1; try { $health = Invoke-RestMethod 'http://127.0.0.1:4173/api/health?wait=tools' -TimeoutSec 70 } catch {} }
          $health | ConvertTo-Json
          if (-not $health.ffmpeg -or -not $health.ffprobe) { throw 'Installed app reports FFmpeg missing' }
          $session = Invoke-RestMethod 'http://127.0.0.1:4173/api/local/session' -SessionVariable web
          $headers = @{ 'X-Mono-CSRF' = $session.csrf; 'Origin' = 'http://127.0.0.1:4173' }
          # Same as the first-run assistant: create the archive in the default place.
          Invoke-RestMethod 'http://127.0.0.1:4173/api/local/library/configure' -Method Post -WebSession $web -Headers $headers -ContentType 'application/json' -Body '{"useDefault":true}' | ConvertTo-Json
          $pre = Invoke-RestMethod 'http://127.0.0.1:4173/api/local/preflight' -WebSession $web -TimeoutSec 60
          $pre | ConvertTo-Json -Depth 5
          if (-not $pre.canRecord) { throw 'Pre-flight check blocks recording on a fresh install' }
          $caps = Invoke-RestMethod 'http://127.0.0.1:4173/api/local/capture/capabilities' -WebSession $web -TimeoutSec 30
          for ($i = 0; $i -lt 20 -and -not $caps.ready -and $caps.supported -ne $false; $i++) { Start-Sleep 1; $caps = Invoke-RestMethod 'http://127.0.0.1:4173/api/local/capture/capabilities' -WebSession $web }
          $caps | ConvertTo-Json -Depth 5
          # The runner has no audio endpoints; the helper must still start and answer.
          if ($caps.reason -eq 'HELPER_UNAVAILABLE') { throw 'Bundled MonoAudio.exe was not found by the installed app' }
          Stop-Process -Id $job.Id -Force -ErrorAction SilentlyContinue

      - name: The archive a person downloads — one installer icon, one folder
        shell: pwsh
        run: |
          $setup = Get-ChildItem .build/installer -Filter 'MONO-Setup-*.exe' | Select-Object -First 1
          $root = Join-Path $env:RUNNER_TEMP 'MONO-release'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue; New-Item $root -ItemType Directory | Out-Null
          Copy-Item $setup.FullName (Join-Path $root 'Установить и запустить MONO.exe')
          Copy-Item $env:PORTABLE_DIR (Join-Path $root 'MONO без установки') -Recurse
          New-Item .build/release -ItemType Directory -Force | Out-Null
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath ".build/release/MONO-$env:MONO_VERSION-Windows.zip"
          # what the person sees after unpacking: exactly one installer and one folder
          $top = Get-ChildItem $root | Select-Object -ExpandProperty Name
          $top
          if (@($top).Count -ne 2) { throw 'The archive must hold one installer and one folder' }

      - uses: actions/upload-artifact@v4
        with:
          name: MONO-Windows
          path: MONO/.build/release/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MONO-portable-windows
          path: MONO/.build/portable/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MONO-Setup-windows
          path: MONO/.build/installer/MONO-Setup-*.exe
          if-no-files-found: error
