name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# The application lives in MONO/ (the repository root holds only the installer and that folder).
defaults:
  run:
    working-directory: MONO

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        # A static build from GitHub (the same BtbN builds the Windows job uses): seconds instead of
        # apt, whose mirrors have taken 19+ minutes on hosted runners. apt stays as the fallback.
        run: |
          set -e
          if curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz; then
            mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
            echo /tmp/ffmpeg/bin >> "$GITHUB_PATH"
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Syntax check
        shell: bash
        run: npm run check
      - name: Node tests
        run: node --test
      - name: Python tests
        working-directory: MONO/launcher
        run: python -m unittest discover -s tests

  e2e:
    name: Browser recording (${{ matrix.os }}, Chromium, fake microphone)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        # A static build from GitHub (the same BtbN builds the Windows job uses): seconds instead of
        # apt, whose mirrors have taken 19+ minutes on hosted runners. apt stays as the fallback.
        run: |
          set -e
          if curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz; then
            mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
            echo /tmp/ffmpeg/bin >> "$GITHUB_PATH"
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install Playwright Chromium
        shell: bash
        run: npm install --no-save playwright && npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - run: npm run test:e2e
